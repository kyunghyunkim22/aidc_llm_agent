services:
  vllm:
    image: vllm/vllm-openai:gemma4
    container_name: vllm-gemma4
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    network_mode: host
    ipc: host
    volumes:
      - /home/aidc/vllm/models:/models
    command: >
      --model /models/gemma-4-E4B-it-W4A16
      --dtype float16
      --quantization gptq_marlin
      --max-model-len 32768
      --gpu-memory-utilization 0.9
      --max-num-seqs 5
      --port 8000
      --enable-auto-tool-choice
      --tool-call-parser gemma4
    restart: unless-stopped