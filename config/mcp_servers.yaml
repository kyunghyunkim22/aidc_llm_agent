# LangGraph 에이전트가 연결할 MCP 서버 목록.
# 각 항목은 langchain_mcp_adapters 의 connection dict 형태.
#
# transport:
#   streamable_http (FastMCP transport="http") — 기본
#   sse             (FastMCP transport="sse")
#   stdio           (서브프로세스)

maria_mcp:
  transport: streamable_http
  url: "${MARIA_MCP_URL}"
  headers:
    X-API-Key: "${MCP_API_KEY}"

