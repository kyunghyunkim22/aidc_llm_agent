[project]
name = "aidc-llm-agent"
version = "0.1.0"
description = "DCIM AI 이벤트 분석 시스템"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0.0",
    "asyncmy>=0.2.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "langchain-mcp-adapters>=0.1.0",
    "pyyaml>=6.0",
    "langgraph>=1.1.10",
    "langchain-openai>=1.2.1",
    "httpx>=0.27",
]

[project.scripts]
maria-mcp = "maria_mcp.__main__:main"
maria-mcp-diag = "maria_mcp.diagnostics:main"
metric-mcp = "metric_mcp.__main__:main"
metric-mcp-diag = "metric_mcp.diagnostics:main"
mcp-client-diag = "mcp_client.__main__:main"
test-harness = "test_harness.repl:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maria_mcp", "src/metric_mcp", "src/mcp_client", "src/test_harness"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
